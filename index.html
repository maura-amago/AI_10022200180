<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ghana Budget Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .ghana-gradient { background: linear-gradient(90deg, #006B3F 0%, #FCD116 50%, #CE1126 100%); height: 4px; }
        .btn-ghana { background: #006B3F; transition: all 0.3s ease; }
        .btn-ghana:hover { background: #004d2e; transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="ghana-gradient fixed top-0 left-0 w-full z-50"></div>
    
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10">
            <div>
                <h1 class="text-4xl font-bold text-gray-900 tracking-tight">Ghana Budget <span class="text-green-700">AI</span></h1>
                <p class="text-gray-500 mt-1">Intelligent RAG Assistant | Maureen Amago (10022200180)</p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-2">
                <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">Live PDF Analysis</span>
                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold">RAG Pipeline</span>
            </div>
        </header>

        <!-- Main Dashboard -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Interaction -->
            <div class="lg:col-span-2 space-y-6">
                <div class="glass p-6 rounded-2xl shadow-xl">
                    <label class="block text-sm font-medium text-gray-700 mb-2">What would you like to know about the 2025 Budget?</label>
                    <div class="flex space-x-2">
                        <input type="text" id="queryInput" placeholder="Ask about revenue, growth, or policies..." 
                               class="flex-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all">
                        <button onclick="askQuestion()" class="btn-ghana text-white px-6 py-3 rounded-xl font-semibold shadow-lg">
                            Analyze
                        </button>
                    </div>
                </div>

                <!-- Answer Area -->
                <div id="answerSection" class="hidden glass p-8 rounded-2xl shadow-xl border-t-4 border-green-600 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-green-700 mb-4">AI GENERATED RESPONSE</h3>
                    <p id="responseText" class="text-lg text-gray-800 leading-relaxed italic"></p>
                </div>

                <!-- Chunk Display -->
                <div id="chunkSection" class="hidden space-y-4">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-gray-500">Retrieved Evidence (Grounded Source)</h3>
                    <div id="chunkContainer" class="grid grid-cols-1 gap-4">
                        <!-- Chunks will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Pipeline Trace -->
            <div class="space-y-6">
                <div class="glass p-6 rounded-2xl shadow-lg">
                    <h3 class="font-bold text-gray-900 mb-4">Pipeline Trace</h3>
                    <div class="space-y-4 text-sm">
                        <div class="flex items-center space-x-3">
                            <div id="step1" class="w-2 h-2 rounded-full bg-gray-300"></div>
                            <span class="text-gray-600">Query Expansion</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div id="step2" class="w-2 h-2 rounded-full bg-gray-300"></div>
                            <span class="text-gray-600">Vector Search (TF-IDF)</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div id="step3" class="w-2 h-2 rounded-full bg-gray-300"></div>
                            <span class="text-gray-600">Domain-Specific Boost</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div id="step4" class="w-2 h-2 rounded-full bg-gray-300"></div>
                            <span class="text-gray-600">Context Reranking</span>
                        </div>
                    </div>
                </div>

                <div id="intentCard" class="hidden glass p-6 rounded-2xl shadow-lg border-l-4 border-yellow-500">
                    <h3 class="font-bold text-gray-900 mb-1">Detected Intent</h3>
                    <p id="intentValue" class="text-yellow-700 font-semibold"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function askQuestion() {
            const query = document.getElementById('queryInput').value;
            if (!query) return;

            // Reset UI
            document.querySelectorAll('[id^="step"]').forEach(s => s.classList.replace('bg-green-500', 'bg-gray-300'));
            
            try {
                // Step 1: expansión
                document.getElementById('step1').classList.replace('bg-gray-300', 'bg-green-500');
                
                const response = await fetch('http://localhost:5000/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();

                // Step 2-4
                document.getElementById('step2').classList.replace('bg-gray-300', 'bg-green-500');
                document.getElementById('step3').classList.replace('bg-gray-300', 'bg-green-500');
                document.getElementById('step4').classList.replace('bg-gray-300', 'bg-green-500');

                // Display Intent
                document.getElementById('intentCard').classList.remove('hidden');
                document.getElementById('intentValue').innerText = data.intent;

                // Display Answer
                document.getElementById('answerSection').classList.remove('hidden');
                document.getElementById('responseText').innerText = data.answer;

                // Display Chunks
                document.getElementById('chunkSection').classList.remove('hidden');
                const container = document.getElementById('chunkContainer');
                container.innerHTML = '';
                
                data.chunks.forEach((c, i) => {
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-bold bg-gray-100 px-2 py-1 rounded text-gray-500">CHUNK ${i+1}</span>
                                <span class="text-[10px] font-bold text-green-600">SCORE: ${c.score.toFixed(4)}</span>
                            </div>
                            <p class="text-xs text-gray-600 leading-relaxed">${c.text}</p>
                        </div>
                    `;
                });

            } catch (err) {
                alert("Make sure the backend.py is running!");
            }
        }
    </script>
</body>
</html>
